schema_version: "1"
states:
  - id: spec
    terminal: false
  - id: author
    terminal: false
  - id: build
    terminal: false
  - id: review
    terminal: false
  - id: sim-verify
    terminal: false
  - id: integrate
    terminal: false
  - id: deploy
    terminal: false
  - id: post-metrics
    terminal: false
  - id: done
    terminal: true
  - id: rollback
    terminal: true
transitions:
  - from: spec
    to: author
    on_failure: rollback
  - from: author
    to: build
    required_gates: [author_artifact]
    on_failure: rollback
  - from: build
    to: review
    required_gates: [tests_build]
    # A build/provider failure is recoverable work, not product rollback:
    # return to author so the Council can reorient with the failure context
    # and retry on the next eligible provider without discarding the branch.
    on_failure: author
  - from: review
    to: sim-verify
    required_gates: [cross_review]
    on_failure: author
  - from: sim-verify
    to: integrate
    required_gates: [sim_verify]
    on_failure: author
  - from: integrate
    to: deploy
    required_gates: [integrated]
    on_failure: rollback
  - from: deploy
    to: post-metrics
    required_gates: [deploy_effect_confirmed]
    on_failure: rollback
  - from: post-metrics
    to: done
    required_gates: [post_metrics]
    on_failure: rollback
